<!DOCTYPE html>
<html>
<head>
  <title>Private Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    /* LOGIN */
    #login {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: #1c1c1e;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 280px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin-top: 10px;
      background: #2c2c2e;
      color: white;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #007aff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* CHAT */
    #chat {
      display: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px;
      background: #1c1c1e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .bubble {
      max-width: 70%;
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 10px;
      word-wrap: break-word;
    }

    .me {
      background: #007aff;
      margin-left: auto;
    }

    .her {
      background: #2c2c2e;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #1c1c1e;
      gap: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border-radius: 10px;
      border: none;
      padding: 10px;
      background: #2c2c2e;
      color: white;
    }

    .hidden {
      filter: blur(12px);
    }

    img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h2>🔒 Private Space</h2>
    <input type="password" id="pass" placeholder="Enter password">
    <button onclick="checkPass()">Enter</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat">

  <header>
    <div>💬 Just Us</div>
    <button onclick="toggleHide()">👁</button>
  </header>

  <div id="messages"></div>

  <div class="input-area">
    <textarea id="msg" rows="1" placeholder="Type a message..."></textarea>
    <input type="file" id="img">
    <button onclick="send()">➤</button>
  </div>

</div>

<script>
const PASSWORD = "000000";
const GIST_ID = "YOUR_GIST_ID";
const TOKEN = prompt("Enter secret token");

let hidden = false;

function checkPass() {
  if (document.getElementById("pass").value === PASSWORD) {
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
    loadMessages();
  } else {
    alert("Wrong password");
  }
}

function toggleHide() {
  hidden = !hidden;
  document.getElementById("messages").classList.toggle("hidden");
}

async function loadMessages() {
  const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
  const data = await res.json();
  const content = JSON.parse(data.files["chat.json"].content);

  const box = document.getElementById("messages");
  box.innerHTML = "";

  content.messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "bubble " + (m.sender === "me" ? "me" : "her");

    if (m.type === "text") {
      div.innerText = m.text;
    } else {
      div.innerHTML = `<img src="${m.url}">`;
    }

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

async function send() {
  const text = document.getElementById("msg").value;
  const file = document.getElementById("img").files[0];

  const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
  const data = await res.json();
  const content = JSON.parse(data.files["chat.json"].content);

  if (text) {
    content.messages.push({ type: "text", text, sender: "me" });
  }

  if (file) {
    const reader = new FileReader();
    reader.onload = async function() {
      content.messages.push({ type: "image", url: reader.result, sender: "me" });
      await update(content);
    };
    reader.readAsDataURL(file);
  } else {
    await update(content);
  }

  document.getElementById("msg").value = "";
}

async function update(content) {
  await fetch(`https://api.github.com/gists/${GIST_ID}`, {
    method: "PATCH",
    headers: {
      "Authorization": "token " + TOKEN
    },
    body: JSON.stringify({
      files: {
        "chat.json": {
          content: JSON.stringify(content)
        }
      }
    })
  });

  loadMessages();
}
</script>

</body>
</html>
