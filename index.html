<!DOCTYPE html>
<html>
<head>
  <title>Private Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --surface3: #252533;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --accent: #7c5cfc;
      --accent2: #5c8dfc;
      --text: #f0f0f5;
      --muted: #8888a0;
      --dimmer: #5a5a70;
      --bubble-me: linear-gradient(135deg, #7c5cfc, #5c8dfc);
      --bubble-her: #1c1c27;
      --radius: 18px;
      --radius-sm: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* ── LOGIN ── */
    #login {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 30% 50%, rgba(124,92,252,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 30%, rgba(92,141,252,0.08) 0%, transparent 50%),
                  var(--bg);
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 24px;
      padding: 40px 36px;
      width: 340px;
      text-align: center;
    }

    .lock-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, rgba(124,92,252,0.2), rgba(92,141,252,0.15));
      border: 1px solid rgba(124,92,252,0.3);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 26px;
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .login-card p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .input-wrap input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrap input:focus {
      border-color: rgba(124,92,252,0.5);
      box-shadow: 0 0 0 3px rgba(124,92,252,0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c5cfc, #5c8dfc);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }

    .error-msg {
      font-size: 12px;
      color: #fc5c7c;
      margin-top: 8px;
      display: none;
    }

    /* ── CHAT ── */
    #chat {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    /* Header */
    .chat-header {
      padding: 14px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(10px);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(124,92,252,0.3), rgba(92,141,252,0.2));
      border: 1px solid rgba(124,92,252,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-info { flex: 1; }
    .header-name { font-size: 15px; font-weight: 600; }
    .header-status { font-size: 12px; color: #5cfc8a; display: flex; align-items: center; gap: 5px; }
    .status-dot { width: 6px; height: 6px; background: #5cfc8a; border-radius: 50%; }

    .header-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--surface2);
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover { background: var(--surface3); color: var(--text); }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface3) transparent;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 75%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.me { margin-left: auto; flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .msg-row.me .msg-avatar {
      background: linear-gradient(135deg, rgba(124,92,252,0.4), rgba(92,141,252,0.3));
    }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.55;
      max-width: 100%;
      word-break: break-word;
    }

    .msg-row.me .bubble {
      background: var(--bubble-me);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .msg-row.her .bubble {
      background: var(--bubble-her);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    .bubble img { max-width: 220px; border-radius: 10px; display: block; margin-top: 4px; }
    .bubble video { max-width: 220px; border-radius: 10px; display: block; margin-top: 4px; }
    .bubble a { color: #a0c4ff; text-decoration: none; }
    .bubble a:hover { text-decoration: underline; }

    .bubble-err { color: #fc5c7c; font-size: 13px; }

    .timestamp {
      font-size: 11px;
      color: var(--dimmer);
      margin: 0 6px 4px;
    }

    .day-divider {
      text-align: center;
      font-size: 12px;
      color: var(--dimmer);
      margin: 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .day-divider::before, .day-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Input */
    .input-area {
      padding: 12px 16px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 8px 8px 8px 14px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: rgba(124,92,252,0.4);
      box-shadow: 0 0 0 3px rgba(124,92,252,0.08);
    }

    #msg {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14.5px;
      resize: none;
      max-height: 100px;
      line-height: 1.5;
      padding: 4px 0;
    }

    #msg::placeholder { color: var(--dimmer); }

    .attach-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .attach-btn:hover { color: var(--text); }

    .send-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: linear-gradient(135deg, #7c5cfc, #5c8dfc);
      border-radius: 10px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: opacity 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .send-btn:hover { opacity: 0.88; }
    .send-btn:active { transform: scale(0.93); }

    #file { display: none; }

    /* Hidden mode */
    #messages.blurred { filter: blur(8px); pointer-events: none; user-select: none; }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      background: var(--bubble-her);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 5px;
      width: fit-content;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--surface3);
      border: 1px solid var(--border2);
      color: var(--text);
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>

<div id="login">
  <div class="login-card">
    <div class="lock-icon">🔒</div>
    <h2>Private Chat</h2>
    <p>Enter your password to unlock</p>
    <div class="input-wrap">
      <input type="password" id="pass" placeholder="Password" onkeydown="if(event.key==='Enter')enter()">
    </div>
    <p class="error-msg" id="err">Incorrect password. Try again.</p>
    <button class="btn-primary" onclick="enter()">Unlock</button>
  </div>
</div>

<div id="chat">
  <header class="chat-header">
    <div class="avatar">💬</div>
    <div class="header-info">
      <div class="header-name">Private</div>
      <div class="header-status">
        <span class="status-dot"></span>
        <span>Encrypted</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleHide()" title="Toggle visibility">👁</button>
      <button class="icon-btn" onclick="load()" title="Refresh">↻</button>
    </div>
  </header>

  <div id="messages">
    <div class="day-divider">Today</div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="msg" rows="1" placeholder="Message…"
        oninput="autoResize(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
      ></textarea>
      <button class="attach-btn" onclick="document.getElementById('file').click()" title="Attach">📎</button>
      <input type="file" id="file">
      <button class="send-btn" onclick="send()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const PASSWORD = "4561";
const GIST_ID = "7199528748612e8988939f22fa79be11";
const TOKEN = "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";
const SECRET = "48625";

let hidden = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function enter() {
  if (document.getElementById("pass").value === PASSWORD) {
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
    load();
  } else {
    document.getElementById("err").style.display = "block";
    const inp = document.getElementById("pass");
    inp.style.borderColor = "rgba(252,92,124,0.6)";
    setTimeout(() => { inp.style.borderColor = ''; }, 1200);
  }
}

function toggleHide() {
  hidden = !hidden;
  document.getElementById("messages").classList.toggle("blurred", hidden);
  showToast(hidden ? "Messages hidden" : "Messages visible");
}

function encrypt(data) {
  return CryptoJS.AES.encrypt(data, SECRET).toString();
}

function decrypt(data) {
  try {
    const bytes = CryptoJS.AES.decrypt(data, SECRET);
    return bytes.toString(CryptoJS.enc.Utf8);
  } catch { return null; }
}

function timeLabel() {
  const now = new Date();
  return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}

async function load() {
  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
    const data = await res.json();
    const content = JSON.parse(data.files["chat.json"].content);

    const container = document.getElementById("messages");
    container.innerHTML = '<div class="day-divider">Today</div>';

    content.messages.forEach(m => {
      const isMe = m.sender === "me";
      const row = document.createElement("div");
      row.className = "msg-row " + (isMe ? "me" : "her");

      const av = document.createElement("div");
      av.className = "msg-avatar";
      av.textContent = isMe ? "🫵" : "👤";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const decrypted = decrypt(m.data);

      if (!decrypted) {
        bubble.innerHTML = '<span class="bubble-err">⚠ Wrong key</span>';
      } else if (m.type === "text") {
        bubble.textContent = decrypted;
      } else if (m.type === "image") {
        bubble.innerHTML = `<img src="${decrypted}">`;
      } else if (m.type === "video") {
        bubble.innerHTML = `<video controls src="${decrypted}"></video>`;
      } else {
        bubble.innerHTML = `<a href="${decrypted}" target="_blank">📄 Open File</a>`;
      }

      const ts = document.createElement("span");
      ts.className = "timestamp";
      ts.textContent = m.time || "";

      row.appendChild(av);
      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.flexDirection = "column";
      wrap.style.alignItems = isMe ? "flex-end" : "flex-start";
      wrap.appendChild(bubble);
      wrap.appendChild(ts);
      row.appendChild(wrap);

      container.appendChild(row);
    });

    container.scrollTop = container.scrollHeight;
  } catch(e) {
    showToast("Could not load messages");
  }
}

async function send() {
  const text = document.getElementById("msg").value.trim();
  const file = document.getElementById("file").files[0];

  if (!text && !file) return;

  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
    const data = await res.json();
    const content = JSON.parse(data.files["chat.json"].content);
    const t = timeLabel();

    if (text) {
      content.messages.push({ type: "text", data: encrypt(text), sender: "me", time: t });
    }

    if (file) {
      const reader = new FileReader();
      reader.onload = async function() {
        const base64 = reader.result;
        let type = "file";
        if (file.type.startsWith("image")) type = "image";
        else if (file.type.startsWith("video")) type = "video";
        content.messages.push({ type, data: encrypt(base64), sender: "me", time: t });
        await update(content);
      };
      reader.readAsDataURL(file);
    } else {
      await update(content);
    }

    document.getElementById("msg").value = "";
    document.getElementById("msg").style.height = 'auto';
    document.getElementById("file").value = "";
  } catch(e) {
    showToast("Failed to send");
  }
}

async function update(content) {
  await fetch(`https://api.github.com/gists/${GIST_ID}`, {
    method: "PATCH",
    headers: { "Authorization": "token " + TOKEN },
    body: JSON.stringify({
      files: { "chat.json": { content: JSON.stringify(content) } }
    })
  });
  load();
}
</script>
</body>
</html>
