<!DOCTYPE html>
<html>
<head>
  <title>Private Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #0f0f0f;
      color: white;
    }

    #login {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      background: #1c1c1e;
      padding: 25px;
      border-radius: 15px;
      width: 280px;
      text-align: center;
    }

    input, textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #2c2c2e;
      color: white;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border-radius: 10px;
      border: none;
      background: #007aff;
      color: white;
      cursor: pointer;
    }

    #chat {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    header {
      padding: 12px;
      background: #1c1c1e;
      display: flex;
      justify-content: space-between;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .bubble {
      max-width: 70%;
      padding: 10px;
      border-radius: 15px;
      margin: 8px;
    }

    .me {
      background: #007aff;
      margin-left: auto;
    }

    .her {
      background: #2c2c2e;
    }

    .input-area {
      display: flex;
      gap: 5px;
      padding: 10px;
      background: #1c1c1e;
    }

    .hidden {
      filter: blur(10px);
    }

    img, video {
      max-width: 100%;
      border-radius: 10px;
    }

    a {
      color: lightblue;
    }
  </style>
</head>

<body>

<div id="login">
  <div class="box">
    <h3>🔒 Private Chat</h3>
    <input type="password" id="pass" placeholder="Login password">
    <button onclick="enter()">Enter</button>
  </div>
</div>

<div id="chat">
  <header>
    <span>💬 Private</span>
    <button onclick="toggleHide()">👁</button>
  </header>

  <div id="messages"></div>

  <div class="input-area">
    <textarea id="msg" rows="1" placeholder="Message"></textarea>
    <input type="file" id="file">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
const PASSWORD = "4561";
const GIST_ID = "7199528748612e8988939f22fa79be11";
const TOKEN = prompt("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");
const SECRET = prompt("48625");

let hidden = false;

function enter() {
  if (document.getElementById("pass").value === PASSWORD) {
    login.style.display = "none";
    chat.style.display = "flex";
    load();
  } else alert("Wrong password");
}

function toggleHide() {
  hidden = !hidden;
  messages.classList.toggle("hidden");
}

function encrypt(data) {
  return CryptoJS.AES.encrypt(data, SECRET).toString();
}

function decrypt(data) {
  try {
    const bytes = CryptoJS.AES.decrypt(data, SECRET);
    return bytes.toString(CryptoJS.enc.Utf8);
  } catch {
    return null;
  }
}

async function load() {
  const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
  const data = await res.json();
  const content = JSON.parse(data.files["chat.json"].content);

  messages.innerHTML = "";

  content.messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "bubble " + (m.sender === "me" ? "me" : "her");

    const decrypted = decrypt(m.data);

    if (!decrypted) {
      div.innerText = "⚠️ wrong key";
    } else if (m.type === "text") {
      div.innerText = decrypted;
    } else if (m.type === "image") {
      div.innerHTML = `<img src="${decrypted}">`;
    } else if (m.type === "video") {
      div.innerHTML = `<video controls src="${decrypted}"></video>`;
    } else {
      div.innerHTML = `<a href="${decrypted}" target="_blank">📄 Open File</a>`;
    }

    messages.appendChild(div);
  });

  messages.scrollTop = messages.scrollHeight;
}

async function send() {
  const text = msg.value;
  const file = document.getElementById("file").files[0];

  const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
  const data = await res.json();
  const content = JSON.parse(data.files["chat.json"].content);

  if (text) {
    content.messages.push({
      type: "text",
      data: encrypt(text),
      sender: "me"
    });
  }

  if (file) {
    const reader = new FileReader();

    reader.onload = async function() {
      const base64 = reader.result;

      let type = "file";
      if (file.type.startsWith("image")) type = "image";
      else if (file.type.startsWith("video")) type = "video";

      content.messages.push({
        type: type,
        data: encrypt(base64),
        sender: "me"
      });

      await update(content);
    };

    reader.readAsDataURL(file);
  } else {
    await update(content);
  }

  msg.value = "";
}

async function update(content) {
  await fetch(`https://api.github.com/gists/${GIST_ID}`, {
    method: "PATCH",
    headers: {
      "Authorization": "token " + TOKEN
    },
    body: JSON.stringify({
      files: {
        "chat.json": {
          content: JSON.stringify(content)
        }
      }
    })
  });

  load();
}
</script>

</body>
</html>
